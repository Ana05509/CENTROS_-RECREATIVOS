<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mapa Recreativo de La Maná{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-oscuro: #4a6b57;
            --verde: #6b9080;
            --verde-claro: #eef3ef;
            --texto: #1a2b22;
            --texto-suave: #5c6e64;
            --borde: #d5e6da;
            --sombra-fuerte: 0 10px 28px rgba(20, 60, 40, 0.14);
            --fuente-titulo: "Poppins", "Segoe UI", Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            color: var(--texto);
            background: var(--verde-claro);
        }
        header {
            background: linear-gradient(155deg, var(--verde-oscuro), #3a5647);
            color: #fff;
            padding: 20px 22px;
        }
        header h1 {
            margin: 0 0 4px;
            font-family: var(--fuente-titulo);
            font-size: 1.25rem;
            font-weight: 700;
        }
        header a {
            color: #fff;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        main {
            max-width: 560px;
            margin: 28px auto;
            padding: 0 16px 40px;
        }
        .tarjeta {
            background: #fff;
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--sombra-fuerte);
        }
        .mensaje-exito {
            background: var(--verde-claro);
            border: 1px solid var(--verde);
            color: var(--verde-oscuro);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .campo {
            margin-bottom: 14px;
        }
        .campo label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .campo input[type=text],
        .campo input[type=password],
        .campo input[type=email],
        .campo input[type=number],
        .campo input[type=datetime-local],
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {
            outline: none;
            border-color: var(--verde);
            box-shadow: 0 0 0 3px rgba(107, 144, 128, 0.2);
        }
        .campo .ayuda {
            font-size: 0.75rem;
            color: var(--texto-suave);
            margin-top: 3px;
        }
        .campo .errorlist {
            list-style: none;
            margin: 4px 0 0;
            padding: 0;
            color: #c0392b;
            font-size: 0.78rem;
        }
        .fila-doble {
            display: flex;
            gap: 10px;
        }
        .fila-doble .campo {
            flex: 1;
        }
        .honeypot {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
        .btn-enviar {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 22px;
            background: var(--verde-oscuro);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        }
        .btn-enviar:hover {
            background: var(--verde);
            box-shadow: var(--sombra-fuerte);
        }
        .btn-enviar:active {
            transform: translateY(1px);
        }
        .aviso {
            font-size: 0.78rem;
            color: var(--texto-suave);
            margin-top: 12px;
            text-align: center;
        }
        .aviso a {
            color: var(--verde-oscuro);
            font-weight: 600;
        }
        {% block estilos_extra %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <h1>{% block encabezado_titulo %}🌿 Mapa Recreativo de La Maná{% endblock %}</h1>
        <a href="{% url 'lugares:inicio' %}">← Inicio</a>
    </header>
    <main>
        <div class="tarjeta">
            {% if messages %}
                {% for message in messages %}
                    <div class="mensaje-exito">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block contenido %}{% endblock %}
        </div>
    </main>
    {% block script_extra %}{% endblock %}
</body>
</html>
