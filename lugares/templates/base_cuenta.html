<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mapa Recreativo de La Maná{% endblock %}</title>
    <style>
        :root {
            --verde-oscuro: #1f6e43;
            --verde: #2e8b57;
            --verde-claro: #eaf6ee;
            --texto: #1a2b22;
            --borde: #d5e6da;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--texto);
            background: var(--verde-claro);
        }
        header {
            background: var(--verde-oscuro);
            color: #fff;
            padding: 18px 20px;
        }
        header h1 {
            margin: 0 0 4px;
            font-size: 1.2rem;
        }
        header a {
            color: #fff;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        main {
            max-width: 560px;
            margin: 24px auto;
            padding: 0 16px 40px;
        }
        .tarjeta {
            background: #fff;
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 20px;
        }
        .mensaje-exito {
            background: #eaf6ee;
            border: 1px solid var(--verde);
            color: var(--verde-oscuro);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .campo {
            margin-bottom: 14px;
        }
        .campo label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .campo input[type=text],
        .campo input[type=password],
        .campo input[type=email],
        .campo input[type=number],
        .campo input[type=datetime-local],
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        .campo .ayuda {
            font-size: 0.75rem;
            color: #5c6e64;
            margin-top: 3px;
        }
        .campo .errorlist {
            list-style: none;
            margin: 4px 0 0;
            padding: 0;
            color: #c0392b;
            font-size: 0.78rem;
        }
        .fila-doble {
            display: flex;
            gap: 10px;
        }
        .fila-doble .campo {
            flex: 1;
        }
        .honeypot {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
        .btn-enviar {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 20px;
            background: var(--verde-oscuro);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-enviar:hover {
            background: var(--verde);
        }
        .aviso {
            font-size: 0.78rem;
            color: #5c6e64;
            margin-top: 12px;
            text-align: center;
        }
        .aviso a {
            color: var(--verde-oscuro);
            font-weight: 600;
        }
        {% block estilos_extra %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <h1>{% block encabezado_titulo %}🌿 Mapa Recreativo de La Maná{% endblock %}</h1>
        <a href="{% url 'lugares:inicio' %}">← Inicio</a>
    </header>
    <main>
        <div class="tarjeta">
            {% if messages %}
                {% for message in messages %}
                    <div class="mensaje-exito">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block contenido %}{% endblock %}
        </div>
    </main>
    {% block script_extra %}{% endblock %}
</body>
</html>
